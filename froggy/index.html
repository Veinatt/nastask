<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Открытка для любимки</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        font-family: "Caveat", cursive;
        background: #f6e7c8;
        color: #2e4258;
        overflow: hidden;
      }

      button, button:focus {
        font-family: inherit;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }

      .stage { height: 100dvh; }

      .postcard { width: 100vw; height: 100dvh; perspective: 1800px; }

      .card-inner { position: relative; height: 100%; }

      .face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .front { background: #102433; }
      .back {
        z-index: 20;
        background: #f6e7c8;
        opacity: 0;
        visibility: hidden;
      }
      .sheet {
        position: absolute;
        inset: 0;
        padding: 8vh 9vw 6vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: #3a3228;
      }

      #film { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
      .scene { position: absolute; inset: 0; }
      #scene-fly, #scene-map, #scene-places, #plane { opacity: 0; visibility: hidden; }

      .bus-sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(#7eb8e6 0%, #d5eef8 62%, #d7ebc4 100%);
      }
      .sky-clouds {
        position: absolute;
        left: 0;
        right: 0;
        height: 24%;
        overflow: hidden;
        pointer-events: none;
      }
      .cloud-track { display: flex; width: max-content; height: 100%; align-items: center; }
      .cloud-set { display: flex; align-items: center; gap: 10vw; padding-right: 10vw; }
      .puff {
        height: 110px;
        width: auto;
        flex: none;
        display: block;
      }
      #forest {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8%;
        height: 78%;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }
      #forest img {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 250vw;
        height: auto;
        max-width: none;
      }
      .road {
        position: absolute;
        left: -6%;
        right: -6%;
        bottom: 0;
        height: 18%;
        z-index: 2;
        overflow: hidden;
        background: linear-gradient(#8d959a, #6d757b 42%, #5a6368);
      }
      .road::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 8px;
        background: #c9d0d4;
      }
      .lane {
        position: absolute;
        left: 0;
        top: 46%;
        width: 200%;
        height: 9px;
        background: repeating-linear-gradient(90deg, #f7f4ee 0 72px, transparent 72px 156px);
      }
      #sign {
        position: absolute;
        left: 0;
        bottom: 1%;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .board {
        background: rgba(251, 246, 234, 0.94);
        border-radius: 8px;
        padding: 4px 14px 2px;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        line-height: 1;
        box-shadow: 0 8px 18px rgba(40, 50, 30, 0.12);
      }
      .post {
        width: 10px;
        height: 168px;
        margin-top: 2px;
        background: linear-gradient(#a56b42, #6d4328);
        border-radius: 2px;
      }

      #bus {
        position: absolute;
        left: 50%;
        bottom: 5%;
        width: min(560px, 64vw);
        z-index: 5;
        overflow: visible;
        will-change: transform;
      }
      .bus-flip {
        width: 100%;
        aspect-ratio: 492 / 225;
        overflow: hidden;
        transform: scaleX(-1);
      }
      .bus-photo {
        width: 124.4%;
        max-width: none;
        height: auto;
        margin-left: -12.2%;
        margin-top: -18.9%;
        display: block;
      }
      .plane-svg { width: 100%; height: auto; display: block; overflow: visible; }
      .seat {
        position: absolute;
        overflow: visible;
        line-height: 0;
      }
      /* РЕДАКТИРУЙ ГЕРОЕВ В АВТОБУСЕ
         Прямоугольник — само стекло. left от левого края автобуса, top от верхнего.
         Нос слева. Картинка внутри больше стекла и обрезается по нему. */
      #bus .seat { overflow: hidden; border-radius: 7px; }
      #bus .seat-frog { left: 42.5%; top: 19.1%; width: 8.9%; aspect-ratio: 1; }
      #bus .seat-dog { left: 63.6%; top: 19.1%; width: 9.2%; aspect-ratio: 1; }
      #bus .seat img { position: absolute; height: auto; max-width: none; }
      #bus .seat-frog img { width: 190%; margin-left: -44%; margin-top: -2%; }
      #bus .seat-dog img { width: 190%; margin-left: -46%; margin-top: -4%; }
      .frog {
        width: 100%;
        height: auto;
        display: block;
        transform-origin: 50% 100%;
      }
      .dog { width: 100%; height: auto; display: block; }

      .fly-sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(#6eafdf, #e7f4fb 70%);
      }
      #plane {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 42%;
        width: min(760px, 86vw);
        will-change: transform;
      }
      #plane, #plane-riders, .sit { overflow: visible; }
      #plane-riders { position: absolute; inset: 0; }
      /* РЕДАКТИРУЙ ГЕРОЕВ В САМОЛЁТЕ
         Круг — иллюминатор, все одного размера. Проценты от самолёта. Нос слева.
         Картинка больше стекла и обрезается по кругу. */
      #plane .porthole {
        position: absolute;
        overflow: hidden;
        border-radius: 50%;
        clip-path: ellipse(47% 47% at 50% 50%);
      }
      #plane .porthole img { position: absolute; height: auto; max-width: none; }
      #plane .porthole-frog { left: 41.94%; top: 45.56%; width: 1.84%; aspect-ratio: 3 / 4; }
      #plane .porthole-dog { left: 45.82%; top: 45.56%; width: 1.84%; aspect-ratio: 3 / 4; }
      #plane .porthole-frog img { width: 160%; margin-left: -28%; margin-top: 17%; }
      #plane .porthole-dog img { width: 160%; margin-left: -30%; margin-top: -10%; }

      #scene-map { background: #5eb0d4; }
      #map-frame { position: absolute; overflow: hidden; }
      #europe, #atlas {
        position: absolute;
        left: 0;
        top: 0;
        max-width: none;
      }
      #atlas { display: block; overflow: visible; }

      .plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
      }
      .plate.on { opacity: 1; }
      #plate-ischia { object-position: center 40%; }
      #plate-naples { object-position: center 88%; }
      #plate-pompeii { object-position: center 62%; }
      #plate-vesuvius { object-position: center 42%; }
      .place-fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16%;
        z-index: 1;
        background: linear-gradient(transparent, rgba(12, 16, 18, 0.28));
        pointer-events: none;
      }
      /* РЕДАКТИРУЙ ГЕРОЕВ НА ФОТО МЕСТ
         У каждого места свои числа.
         left и top у .sit-* — где сидят, в процентах кадра.
         width у .frog и .dog-slot — размер. Больше число — крупнее.
         top у .frog — насколько лягушка ниже собаки, в пикселях. */
      .sit {
        position: absolute;
        z-index: 2;
        display: none;
        align-items: flex-end;
        gap: 8px;
        filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.35));
      }
      .sit.on { display: flex; }
      .sit .frog { height: auto; position: relative; }
      .sit .dog-slot { height: auto; }

      .sit-ischia { left: 34%; top: 34.5%; }
      .sit-ischia .frog { width: min(94px, 12vw); top: 5px; }
      .sit-ischia .dog-slot { width: min(86px, 11vw); }

      .sit-naples { left: 25%; top: 90%; }
      .sit-naples .frog { width: min(75px, 9.6vw); top: 4px; }
      .sit-naples .dog-slot { width: min(69px, 8.8vw); }

      .sit-pompeii { left: 48%; top: 62%; }
      .sit-pompeii .frog { width: min(188px, 24vw); top: 10px; }
      .sit-pompeii .dog-slot { width: min(172px, 22vw); }

      .sit-vesuvius { left: 50%; top: 52.5%; }
      .sit-vesuvius .frog { width: min(38px, 4.8vw); top: 2px; }
      .sit-vesuvius .dog-slot { width: min(34px, 4.4vw); }

      #iris {
        position: absolute;
        inset: 0;
        z-index: 8;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .letter h1 {
        font-size: clamp(2.6rem, 6.4vw, 4.6rem);
        font-weight: 600;
        line-height: 0.98;
        max-width: 100%;
        margin: 0 0 1.1rem;
      }
      .letter p {
        font-size: clamp(1.55rem, 2.7vw, 2.25rem);
        line-height: 1.28;
        font-weight: 600;
        max-width: 100%;
        margin-bottom: 0.75rem;
      }
      .letter p:nth-child(3) { margin-left: 0.4rem; }

      #controls {
        position: fixed;
        z-index: 40;
        top: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        background: #f6e7c8;
        color: #2e4258;
        border: 2px solid rgba(46, 66, 88, 0.55);
        border-radius: 999px;
        box-shadow: 0 6px 14px rgba(40, 30, 10, 0.18);
        padding: 2px;
      }
      #controls button {
        width: 36px;
        height: 32px;
        display: grid;
        place-items: center;
        color: inherit;
        border-radius: 999px;
      }
      #controls button + button { box-shadow: inset 1px 0 0 rgba(46, 66, 88, 0.28); }
      #controls svg { width: 16px; height: 16px; display: block; }
      #sound-btn .icon-off,
      #pause-btn .icon-play { display: none; }
      #sound-btn.off .icon-on { display: none; }
      #sound-btn.off .icon-off { display: block; }
      #pause-btn.held .icon-pause { display: none; }
      #pause-btn.held .icon-play { display: block; }
    </style>
  </head>

    <script src="gsap.min.js"></script>
    <script>
      const CLOUD = "—Pngtree—white cartoon clouds clipart_5568114.png";
      document.querySelectorAll(".cloud-track").forEach((track) => {
        const set = document.createElement("div");
        set.className = "cloud-set";
        [1, 0.7, 1.2, 0.55, 0.9, 1.3].forEach((scale) => {
          const img = document.createElement("img");
          img.src = CLOUD;
          img.alt = "";
          img.className = "puff";
          const height = Math.round(150 * scale);
          img.style.height = height + "px";
          img.style.width = height + "px";
          set.appendChild(img);
        });
        track.appendChild(set);
        track.appendChild(set.cloneNode(true));
      });

      /* РЕДАКТИРУЙ КАРТУ
         Карта на весь экран. Кадр сам подгоняется под окно и держит в кадре
         Варшаву, изгиб и Неаполь. Море — голубой фон сцены.
         MAP_ZOOM — увеличение. Больше число — крупнее карта.
         MAP_PAN_X — сдвиг кадра в долях его ширины. Минус уводит окно на запад,
         море справа уходит за край.
         Точки полёта ниже, в пикселях файла europe.png. */
      const MAP_W = 2571;
      const MAP_H = 2412;
      const MAP_ZOOM = 1.42;
      const MAP_PAN_X = -0.22;
      const CROP = { x: 0, y: 0, w: MAP_W, h: MAP_H };

      /* РЕДАКТИРУЙ ПОЛЁТ
         Пиксели файла europe.png: x вправо, y вниз.
         from — Варшава, to — точка прилёта на западном берегу.
         bend — точка, к которой выгибается дуга. Сама кривая доходит до неё примерно наполовину.
         duration — секунды полёта по дуге.
         turn — добавка к повороту носа, в градусах по часовой. */
      const FLIGHT = {
        from: { x: 1600, y: 1160 },
        bend: { x: 1120, y: 1360 },
        to: { x: 1300, y: 1873 },
        duration: 5.2,
      };

      const song = document.getElementById("song");
      const soundBtn = document.getElementById("sound-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const ambient = new Set();
      let started = false;
      let soundOn = true;
      let mapLayout = null;

      function track(tween) {
        ambient.add(tween);
        if (!document.body.classList.contains("held")) tween.play();
      }
      function release(tween) {
        tween.pause();
        ambient.delete(tween);
      }

      function cloudTween(id, duration, dir) {
        const track = document.getElementById(id);
        const distance = () => -track.scrollWidth / 2;
        return gsap.fromTo(track,
          { x: dir < 0 ? 0 : distance },
          { x: dir < 0 ? distance : 0, duration, ease: "none", repeat: -1, paused: true }
        );
      }
      const busClouds = cloudTween("bus-clouds", 140, 1);
      const flyClouds = ["fly-clouds-a", "fly-clouds-b", "fly-clouds-c"].map((id, i) =>
        cloudTween(id, 9 + i * 2.4, 1)
      );
      const laneTween = gsap.fromTo("#lane", { x: -156 }, {
        x: 0,
        duration: 0.24,
        ease: "none",
        repeat: -1,
        paused: true,
      });
      /* РЕДАКТИРУЙ ЛЕС
         width в стилях #forest img — насколько мелкие деревья. Меньше число — больше деревьев в кадре.
         xPercent — сдвиг в процентах ширины картинки. Минус уводит лес влево.
         Первое число — откуда стартует, второе — куда приезжает. Они должны отличаться, иначе лес стоит. */
      const forestTween = gsap.fromTo("#forest img",
        { xPercent: -38 },
        { xPercent: -32, duration: 4, ease: "none", paused: true }
      );

      /* РЕДАКТИРУЙ ЛЯГУШКУ
         Танец всех лягушек на странице. Крутится без конца.
         scaleX / scaleY — насколько сжимается.
         y — подскок, в пикселях (минус значит вверх).
         В иллюминаторе лягушка мелкая, поэтому подскок в процентах её высоты,
         иначе те же 6 пикселей выглядят как сильный прыжок.
         duration — секунды шага. Больше число — медленнее. */
      const dance = gsap.timeline({ repeat: -1, paused: true });
      dance
        .to(".frog", { scaleX: 1.05, scaleY: 0.92, duration: 0.2, ease: "sine.inOut" })
        .to(".frog:not(#plane .frog)", { scaleX: 0.98, scaleY: 1.03, y: -6, duration: 0.2, ease: "sine.inOut" })
        .to("#plane .frog", { scaleX: 0.98, scaleY: 1.03, yPercent: -6, duration: 0.2, ease: "sine.inOut" }, "<")
        .to(".frog", { scaleX: 1, scaleY: 1, y: 0, yPercent: 0, duration: 0.2, ease: "sine.inOut" });

      function showPlace(name) {
        document.querySelectorAll(".plate, .sit").forEach((el) => {
          el.classList.toggle("on", el.dataset.place === name);
        });
      }

      function signMeet() {
        const scene = document.getElementById("scene-bus").getBoundingClientRect();
        const nose = document.querySelector(".bus-flip").getBoundingClientRect().left - scene.left + 12;
        const sign = document.getElementById("sign");
        const post = sign.querySelector(".post").getBoundingClientRect();
        const currentX = Number(gsap.getProperty(sign, "x")) || 0;
        const postCenter = post.left - scene.left + post.width * 0.5 - currentX;
        return nose - postCenter;
      }

      const roadSpeed = 156 / 0.24;
      const signRide = 4.6;
      function signStart() {
        return signMeet() - roadSpeed * signRide;
      }

      gsap.set("#sign", {
        x: signStart,
        transformOrigin: "50% 100%",
      });
      gsap.set("#bus", { xPercent: -50, transformOrigin: "16% 60%" });
      gsap.set("#plane", {
        xPercent: -50,
        yPercent: -50,
        x: "22vw",
        scale: 6.4,
        transformOrigin: "50% 50%",
      });

      function layoutMap() {
        const view = document.getElementById("film").getBoundingClientRect();
        const aspect = view.width / Math.max(view.height, 1);
        let cropW;
        let cropH;
        if (MAP_W / MAP_H >= aspect) {
          cropH = MAP_H;
          cropW = Math.min(MAP_W, MAP_H * aspect);
        } else {
          cropW = MAP_W;
          cropH = Math.min(MAP_H, MAP_W / aspect);
        }
        cropW /= MAP_ZOOM;
        cropH /= MAP_ZOOM;
        const points = [FLIGHT.from, FLIGHT.bend, FLIGHT.to];
        const pad = 140;
        const minX = Math.min.apply(null, points.map((p) => p.x)) - pad;
        const maxX = Math.max.apply(null, points.map((p) => p.x)) + pad;
        const minY = Math.min.apply(null, points.map((p) => p.y)) - pad;
        const maxY = Math.max.apply(null, points.map((p) => p.y)) + pad;
        let x = (minX + maxX) / 2 - cropW / 2 + cropW * MAP_PAN_X;
        let y = (minY + maxY) / 2 - cropH / 2;
        x = Math.max(0, Math.min(MAP_W - cropW, x));
        y = Math.max(0, Math.min(MAP_H - cropH, y));
        if (cropW >= maxX - minX) {
          if (x > minX) x = Math.max(0, minX);
          if (x + cropW < maxX) x = Math.min(MAP_W - cropW, maxX - cropW);
        }
        if (cropH >= maxY - minY) {
          if (y > minY) y = Math.max(0, minY);
          if (y + cropH < maxY) y = Math.min(MAP_H - cropH, maxY - cropH);
        }
        CROP.x = x;
        CROP.y = y;
        CROP.w = cropW;
        CROP.h = cropH;
        const scale = view.width / cropW;
        const frame = document.getElementById("map-frame");
        frame.style.left = "0px";
        frame.style.top = "0px";
        frame.style.width = view.width + "px";
        frame.style.height = view.height + "px";
        const imgLeft = -x * scale;
        const imgTop = -y * scale;
        [document.getElementById("europe"), document.getElementById("atlas")].forEach((el) => {
          el.style.left = imgLeft + "px";
          el.style.top = imgTop + "px";
          el.style.width = MAP_W * scale + "px";
          el.style.height = MAP_H * scale + "px";
        });
        mapLayout = { scale, left: imgLeft, top: imgTop, view };
      }

      function arcMap(t) {
        const u = 1 - t;
        const a = FLIGHT.from;
        const b = FLIGHT.bend;
        const c = FLIGHT.to;
        return {
          x: u * u * a.x + 2 * u * t * b.x + t * t * c.x,
          y: u * u * a.y + 2 * u * t * b.y + t * t * c.y,
        };
      }

      function arcHeading(t) {
        const ahead = Math.min(1, t + 0.06);
        const here = arcMap(Math.max(0, ahead - 0.06));
        const next = arcMap(ahead);
        const flight = Math.atan2(next.y - here.y, next.x - here.x) * 180 / Math.PI;
        return flight - 180 + (FLIGHT.turn || 0);
      }

      function arcPose(t) {
        const point = arcMap(t);
        const sx = mapLayout.left + point.x * mapLayout.scale;
        const sy = mapLayout.top + point.y * mapLayout.scale;
        return {
          x: sx - mapLayout.view.width / 2,
          y: sy - mapLayout.view.height * 0.42,
          rotation: arcHeading(t),
        };
      }

      function drawRoute(t) {
        const route = document.getElementById("route");
        if (t <= 0) {
          route.setAttribute("d", "");
          return;
        }
        const steps = Math.max(8, Math.ceil(t * 36));
        let d = "";
        for (let i = 0; i <= steps; i += 1) {
          const point = arcMap(t * i / steps);
          d += (i === 0 ? "M" : "L") + point.x.toFixed(1) + " " + point.y.toFixed(1) + " ";
        }
        route.setAttribute("d", d);
      }

      const flightProgress = { t: 0 };

      layoutMap();
      gsap.set("#scene-fly, #scene-map, #scene-places, #plane", { autoAlpha: 0 });

      function resetOpening() {
        gsap.set("#scene-bus", { autoAlpha: 1 });
        gsap.set("#scene-fly, #scene-map, #scene-places", { autoAlpha: 0 });
        gsap.set("#plane", {
          autoAlpha: 0,
          scale: 6.4,
          rotation: 0,
          x: "22vw",
          y: 0,
          transformOrigin: "50% 50%",
        });
        gsap.set("#iris-hole", { attr: { r: 120 } });
        gsap.set(".back", { autoAlpha: 0 });
        gsap.set("#bus", { scaleX: 1, scaleY: 1 });
        gsap.set("#sign", {
          rotation: 0,
          x: signStart,
        });
        showPlace("");
        flightProgress.t = 0;
        drawRoute(0);
      }

      const tl = gsap.timeline({ paused: true });
      tl.call(resetOpening, null, 0);

      tl.add("bus", 0);
      tl.call(() => {
        track(busClouds);
        track(laneTween);
        track(forestTween);
        track(dance);
      }, null, "bus");
      tl.fromTo("#sign",
        { x: signStart },
        { x: signMeet, duration: signRide, ease: "none" },
        "bus"
      );

      tl.add("bump", "bus+=4.6");
      tl.call(() => {
        release(busClouds);
        release(laneTween);
        release(forestTween);
      }, null, "bump");
      tl.to("#bus", { scaleX: 0.94, scaleY: 1.04, duration: 0.12, ease: "power2.in" }, "bump");
      tl.to("#bus", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "power3.out" }, "bump+=0.12");
      tl.to("#sign", { rotation: -12, duration: 0.16, ease: "power2.out" }, "bump");
      tl.to("#sign", { rotation: -2, duration: 0.6, ease: "power3.out" }, "bump+=0.18");

      tl.add("iris1", "bump+=0.9");
      tl.to("#iris-hole", { attr: { r: 0 }, duration: 0.7, ease: "power3.in" }, "iris1");
      tl.call(() => {
        gsap.set("#scene-bus", { autoAlpha: 0 });
        gsap.set("#scene-fly", { autoAlpha: 1 });
        gsap.set("#plane", { autoAlpha: 1 });
        flyClouds.forEach((tween) => track(tween));
      }, null, "iris1+=0.7");
      tl.to("#iris-hole", { attr: { r: 120 }, duration: 0.78, ease: "power3.out" }, "iris1+=0.78");

      tl.add("map", "iris1+=4.4");
      tl.call(() => {
        layoutMap();
        flightProgress.t = 0;
        drawRoute(0);
      }, null, "map");
      tl.set("#plane", { transformOrigin: "50% 50%" }, "map");
      tl.to("#scene-map", { autoAlpha: 1, duration: 1.05, ease: "power2.inOut" }, "map");
      tl.to("#scene-fly", { autoAlpha: 0, duration: 0.9 }, "map+=0.15");
      tl.to("#plane", {
        scale: 0.2,
        x: () => arcPose(0).x,
        y: () => arcPose(0).y,
        rotation: () => arcPose(0).rotation,
        duration: 1.15,
        ease: "power2.inOut",
      }, "map+=0.02");
      tl.to(flightProgress, {
        t: 1,
        duration: FLIGHT.duration,
        ease: "none",
        onUpdate: () => {
          const pose = arcPose(flightProgress.t);
          gsap.set("#plane", { x: pose.x, y: pose.y, rotation: pose.rotation });
          drawRoute(flightProgress.t);
        },
      }, "map+=1.18");

      tl.add("iris2", "map+=" + (1.18 + FLIGHT.duration));
      tl.to("#iris-hole", { attr: { r: 0 }, duration: 0.7, ease: "power3.in" }, "iris2");
      tl.call(() => {
        gsap.set("#scene-fly", { autoAlpha: 0 });
        gsap.set("#scene-map", { autoAlpha: 0 });
        gsap.set("#plane", { autoAlpha: 0 });
        gsap.set("#scene-places", { autoAlpha: 1 });
        flyClouds.forEach((tween) => release(tween));
        showPlace("ischia");
      }, null, "iris2+=0.7");
      tl.to("#iris-hole", { attr: { r: 120 }, duration: 0.78, ease: "power3.out" }, "iris2+=0.78");

      tl.call(() => showPlace("naples"), null, "iris2+=5.6");
      tl.call(() => showPlace("pompeii"), null, "iris2+=9.8");
      tl.call(() => showPlace("vesuvius"), null, "iris2+=14");

      tl.add("letter", "iris2+=18");
      tl.to(".back", { autoAlpha: 1, duration: 1.4, ease: "power2.inOut" }, "letter");
      window.addEventListener("resize", () => {
        if (tl.time() < tl.labels.map) layoutMap();
      });

      function hold(on) {
        document.body.classList.toggle("held", on);
        pauseBtn.classList.toggle("held", on);
        pauseBtn.setAttribute("aria-label", on ? "Дальше" : "Пауза");
        if (on) {
          tl.pause();
          song.pause();
          ambient.forEach((tween) => tween.pause());
          return;
        }
        if (tl.progress() === 1) return;
        tl.resume();
        if (!song.ended) song.play().catch(() => {});
        ambient.forEach((tween) => tween.resume());
      }

      function start() {
        if (started) return;
        started = true;
        song.loop = false;
        song.muted = false;
        song.volume = soundOn ? 0.2 : 0;
        song.play().catch(() => {});
        tl.play();
      }

      function replayFilm() {
        document.body.classList.remove("held");
        pauseBtn.classList.remove("held");
        pauseBtn.setAttribute("aria-label", "Пауза");
        ambient.forEach((tween) => tween.pause(0));
        ambient.clear();
        [busClouds, laneTween, forestTween, dance, ...flyClouds].forEach((tween) => tween.pause(0));
        mapLayout = null;
        resetOpening();
        song.pause();
        song.currentTime = 0;
        song.muted = false;
        song.volume = soundOn ? 0.2 : 0;
        tl.pause(0);
        tl.invalidate();
        layoutMap();
        tl.restart();
        song.play().catch(() => {});
      }

      soundBtn.addEventListener("click", () => {
        const waitingForGesture = soundOn && song.paused && !song.ended && started
          && !document.body.classList.contains("held");
        if (waitingForGesture) {
          song.muted = false;
          song.volume = 0.2;
          song.play().catch(() => {});
          return;
        }
        soundOn = !soundOn;
        song.muted = false;
        song.volume = soundOn ? 0.2 : 0;
        soundBtn.classList.toggle("off", !soundOn);
        soundBtn.setAttribute("aria-label", soundOn ? "Выключить звук" : "Включить звук");
        if (song.paused && started && !document.body.classList.contains("held") && tl.progress() < 1 && !song.ended) {
          song.play().catch(() => {});
        }
      });
      pauseBtn.addEventListener("click", () => {
        if (!started || tl.progress() === 1) return;
        hold(!document.body.classList.contains("held"));
      });
      document.getElementById("replay-btn").addEventListener("click", replayFilm);
      function rewindPostcard() {
        document.body.classList.remove("held");
        pauseBtn.classList.remove("held");
        pauseBtn.setAttribute("aria-label", "Пауза");
        ambient.forEach((tween) => tween.pause(0));
        ambient.clear();
        [busClouds, laneTween, forestTween, dance, ...flyClouds].forEach((tween) => tween.pause(0));
        mapLayout = null;
        resetOpening();
        song.pause();
        song.currentTime = 0;
        tl.pause(0);
        tl.invalidate();
        layoutMap();
        started = false;
      }

      window.startPostcard = function () {
        if (started) rewindPostcard();
        start();
      };
      window.resetPostcard = rewindPostcard;

      document.getElementById("close-btn").addEventListener("click", () => {
        if (window.parent !== window) {
          window.parent.postMessage({ type: "postcard-close" }, location.origin);
          return;
        }
        location.href = "/";
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        gsap.set(".back", { autoAlpha: 1 });
      } else if (window.parent === window) {
        start();
      }
    </script>
  </body>
</html>
