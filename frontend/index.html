<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>NasTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <!-- Boot-only styles. Do NOT set html/body background/color here —
         unlayered rules beat @layer base theme (dark/cozy break). -->
    <style>
      html, body { margin: 0; min-height: 100%; }
      #boot-fallback {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        padding: 28px 20px;
        text-align: left;
        color: #0f172a;
      }
      #boot-fallback strong { display: block; font-size: 22px; margin-bottom: 8px; text-align: center; }
      #boot-fallback .boot-msg { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 12px; }
      #boot-fallback pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.4;
        color: #b91c1c;
        background: #fff1f2;
        border-radius: 8px;
        padding: 12px;
        margin: 0;
      }
    </style>
    <!-- Must run BEFORE the app module so load/parse errors are visible in Mini App -->
    <script>
      (function () {
        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        }
        window.__showBootError = function (title, detail) {
          var el = document.getElementById('boot-fallback')
          if (!el) return
          el.innerHTML =
            '<strong>NasTask</strong>' +
            '<div class="boot-msg">' +
            esc(title) +
            '</div>' +
            (detail ? '<pre>' + esc(detail) + '</pre>' : '')
        }
        window.addEventListener('error', function (ev) {
          var detail =
            (ev && ev.error && (ev.error.stack || ev.error.message)) ||
            (ev && ev.message) ||
            'unknown error'
          if (ev && ev.filename) {
            detail += '\n\n@ ' + ev.filename + ':' + (ev.lineno || '?')
          }
          window.__showBootError('Ошибка загрузки JS', detail)
        })
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason
          var detail =
            r && (r.stack || r.message)
              ? r.stack || r.message
              : String(r)
          window.__showBootError('Unhandled promise', detail)
        })
      })()
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <strong>NasTask</strong>
        <div class="boot-msg">Загрузка…</div>
      </div>
    </div>
    <script>
      (function () {
        function signalReady() {
          try {
            var wa = window.Telegram && window.Telegram.WebApp
            if (wa && typeof wa.ready === 'function') wa.ready()
            if (wa && typeof wa.expand === 'function') wa.expand()
          } catch (e) {}
        }
        signalReady()
        document.addEventListener('DOMContentLoaded', signalReady)
        setTimeout(signalReady, 0)
        setTimeout(signalReady, 300)
        setTimeout(signalReady, 1200)
        setTimeout(function () {
          var el = document.getElementById('boot-fallback')
          if (el && el.parentNode && el.parentNode.id === 'root' && el.isConnected) {
            if (window.__showBootError) {
              window.__showBootError(
                'Интерфейс не поднялся за 8с (бандл не смонтировался). Пришлите текст ниже, если появится.',
                'boot-fallback still in #root — module did not run createRoot()',
              )
            }
          }
        }, 8000)
      })()
    </script>
    <script type="module">
      import('./src/main.tsx').catch(function (err) {
        var detail = err && (err.stack || err.message) ? err.stack || err.message : String(err)
        if (window.__showBootError) {
          window.__showBootError('Не удалось импортировать приложение', detail)
        }
      })
    </script>
  </body>
</html>
