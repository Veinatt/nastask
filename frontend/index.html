<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>NasTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <!-- Boot-only styles. Do NOT set html/body background/color here —
         unlayered rules beat @layer base theme (dark/cozy break). -->
    <style>
      html, body { margin: 0; min-height: 100%; }
      #boot-error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        box-sizing: border-box;
        padding: 28px 20px;
        overflow: auto;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: #0f172a;
        background: rgb(15 23 42 / 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #boot-error-overlay[data-open='1'] { display: block; }
      #boot-error-overlay .boot-card {
        max-width: 32rem;
        margin: 12vh auto 0;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.2);
      }
      #boot-error-overlay strong {
        display: block;
        font-size: 18px;
        margin-bottom: 8px;
      }
      #boot-error-overlay .boot-msg {
        font-size: 14px;
        color: #64748b;
        margin-bottom: 12px;
      }
      #boot-error-overlay pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.4;
        color: #b91c1c;
        background: #fff1f2;
        border-radius: 8px;
        padding: 12px;
        margin: 0 0 12px;
      }
      #boot-error-overlay button {
        font: inherit;
        font-size: 14px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
    </style>
    <!-- Must run BEFORE the app module so load/parse errors are visible in Mini App -->
    <script>
      (function () {
        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        }
        window.__showBootError = function (title, detail) {
          var el = document.getElementById('boot-error-overlay')
          if (!el) {
            el = document.createElement('div')
            el.id = 'boot-error-overlay'
            document.body.appendChild(el)
          }
          el.setAttribute('data-open', '1')
          el.setAttribute('role', 'alertdialog')
          el.setAttribute('aria-modal', 'true')
          el.innerHTML =
            '<div class="boot-card">' +
            '<strong>NasTask</strong>' +
            '<div class="boot-msg">' +
            esc(title) +
            '</div>' +
            (detail ? '<pre>' + esc(detail) + '</pre>' : '') +
            '<button type="button" id="boot-error-reload">Обновить</button>' +
            '</div>'
          var btn = document.getElementById('boot-error-reload')
          if (btn) {
            btn.onclick = function () {
              window.location.reload()
            }
          }
        }
        window.addEventListener('error', function (ev) {
          var detail =
            (ev && ev.error && (ev.error.stack || ev.error.message)) ||
            (ev && ev.message) ||
            'unknown error'
          if (ev && ev.filename) {
            detail += '\n\n@ ' + ev.filename + ':' + (ev.lineno || '?')
          }
          window.__showBootError('Ошибка загрузки JS', detail)
        })
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason
          var detail =
            r && (r.stack || r.message)
              ? r.stack || r.message
              : String(r)
          window.__showBootError('Unhandled promise', detail)
        })
      })()
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error-overlay"></div>
    <script>
      (function () {
        function signalReady() {
          try {
            var wa = window.Telegram && window.Telegram.WebApp
            if (wa && typeof wa.ready === 'function') wa.ready()
            if (wa && typeof wa.expand === 'function') wa.expand()
          } catch (e) {}
        }
        signalReady()
        document.addEventListener('DOMContentLoaded', signalReady)
        setTimeout(signalReady, 0)
        setTimeout(signalReady, 300)
        setTimeout(signalReady, 1200)
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.querySelector('.app-shell')) {
            if (window.__showBootError) {
              window.__showBootError(
                'Интерфейс не поднялся за 8с (бандл не смонтировался). Пришлите текст ниже, если появится.',
                'no .app-shell in #root — module did not run createRoot()',
              )
            }
          }
        }, 8000)
      })()
    </script>
    <script type="module">
      import('./src/main.tsx').catch(function (err) {
        var detail = err && (err.stack || err.message) ? err.stack || err.message : String(err)
        if (window.__showBootError) {
          window.__showBootError('Не удалось импортировать приложение', detail)
        }
      })
    </script>
  </body>
</html>
